name: Agency Contract Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  contract-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: List Jest Tests
        run: npx jest --listTests

      - name: Run Agency Contract Test
        run: npx jest src/modules/agency/tests/activation.contract.spec.ts --runInBand


